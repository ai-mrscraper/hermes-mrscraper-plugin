name: mrscraper
version: 4.1.0
description: MrScraper status, HTML, Markdown, screenshot, brand, JSON extraction, and web search tools for Hermes.
author: MrScraper
kind: standalone
requires_hermes: ">=0.21.4"
requires_env:
  - MRSCRAPER_API_TOKEN
provides_web_providers:
  - mrscraper
provides_tools:
  - mrscraper_status
  - mrscraper_scrape_html
  - mrscraper_scrape_markdown
  - mrscraper_get_screenshot
  - mrscraper_scrape_brand
  - mrscraper_scrape_json
  - mrscraper_web_search
