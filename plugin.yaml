author: MrScraper
kind: standalone
requires_hermes: ">=0.21.4"
requires_env:
  - MRSCRAPER_API_TOKEN
provides_web_providers:
  - mrscraper
provides_tools:
  - mrscraper_scraper_api
  - mrscraper_web_search
  - mrscraper_account
